<!-- @dsCard group="Brand" viewport="700x300" name="Logo variants" subtitle="Lockup at its 180px minimum, the bar lockup for short chrome, and the mark" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;padding:22px;background:var(--surface-base)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.cell{padding:18px;border-radius:var(--radius-panel);box-shadow:inset 0 0 0 1px var(--border-subtle);background:var(--surface-raised);display:flex;flex-direction:column;gap:14px;justify-content:space-between}
.cell.dark{background:var(--surface-inverse);box-shadow:none}
.cap{font-family:var(--font-mono);text-transform:uppercase;font-size:9.5px;letter-spacing:.17em;color:var(--text-quiet)}
.cell.dark .cap{color:rgba(241,246,241,.5)}
.note{font-size:11.5px;line-height:1.45;color:var(--text-secondary)}
.cell.dark .note{color:rgba(241,246,241,.6)}
@media (max-width:620px){.grid{grid-template-columns:minmax(0,1fr)}}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script></head><body><div id="root"></div>
<script type="text/babel">
const { Logo } = window.DareToCareDesignSystem_8f725c;
function Demo(){
 return <div className="grid">
  <div className="cell">
   <span className="cap">variant="lockup"</span>
   <Logo width={196} basePath="../.."/>
   <span className="note">Sized by width, never height. Clamped to a 180px minimum — the asset is 2:1, so a "reasonable" height crushes the HOME CARE line.</span>
  </div>
  <div className="cell">
   <span className="cap">variant="bar"</span>
   <Logo variant="bar" height={34} basePath="../.."/>
   <span className="note">For top bars and mastheads under ~90px tall: the mark at full strength beside a typeset wordmark.</span>
  </div>
  <div className="cell dark">
   <span className="cap">onDark · variant="mark"</span>
   <div style={{display:"flex",alignItems:"center",gap:16}}>
    <Logo variant="bar" onDark height={30} basePath="../.."/>
    <Logo variant="mark" onDark height={30} basePath="../.."/>
   </div>
   <span className="note">White cut-outs for forest and deep-green grounds. The mark alone holds down to 24px.</span>
  </div>
 </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script></body></html>
