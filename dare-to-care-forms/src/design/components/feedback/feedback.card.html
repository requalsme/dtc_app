<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{margin:0;padding:22px;background:var(--surface-app)}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script></head><body><div id="root"></div>
<script type="text/babel">
const { Icon, Logo, MonoLabel, Rule, Button, IconButton, Panel, Stamp, Chip, Avatar,
  Input, Textarea, Select, Checkbox, Radio, Switch, SignaturePad, ScoreMeter,
  NavItem, Tabs, Stepper, RoleTile, Banner, Dialog, EmptyState, Toast,
  RecordRow, MetricTile, DocumentSlot, VideoModule } = window.DareToCareDesignSystem_8f725c;
const Row = ({children, gap=12, style}) => <div style={{display:"flex",alignItems:"center",gap,flexWrap:"wrap",...style}}>{children}</div>;
const Stack = ({children, gap=16, style}) => <div style={{display:"flex",flexDirection:"column",gap,...style}}>{children}</div>;

function Demo(){
 const [open,setOpen]=React.useState(false);
 return <Stack gap={14}>
  <Banner tone="success" icon={<Icon name="check" size={18}/>} title="Fall Risk Assessment submitted for review" onDismiss={()=>{}}>Priya Raman will see it in the office queue.</Banner>
  <Banner tone="warning" icon={<Icon name="alert" size={18}/>} title="This form was returned for correction" action={<Button size="sm" variant="secondary">Open form</Button>}/>
  <Banner tone="error" icon={<Icon name="wifi" size={18}/>} title="We couldn't save your entry">It's stored on this device — try again when you have signal.</Banner>
  <Row gap={16} style={{alignItems:"stretch"}}>
   <div style={{flex:1}}><EmptyState title="No forms assigned today" description="Your office manager will assign work as it comes in." basePath="../.." action={<Button variant="outline" size="sm">Browse all forms</Button>}/></div>
   <Panel style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center"}}><Button onClick={()=>setOpen(true)}>Open dialog</Button></Panel>
  </Row>
  <div style={{position:"relative",height:52}}>
   <Toast tone="success" icon={<Icon name="check" size={16}/>} style={{position:"static",transform:"none",display:"inline-flex"}}>Form submitted for review</Toast>
  </div>
  <Dialog open={open} onClose={()=>setOpen(false)} title="Submit this form for review?" description="Once submitted, only an office manager can change it." icon={<Icon name="send" size={20}/>}
    footer={<><Button variant="ghost" onClick={()=>setOpen(false)}>Keep editing</Button><Button onClick={()=>setOpen(false)}>Submit</Button></>}/>
 </Stack>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script></body></html>
