[build]
  command = "cd dare-to-care-forms && npm install && npm run build"
  publish = "dare-to-care-forms/dist"

# Serverless ingestion: the scheduled Outlook poll, the two endpoints the review
# queue calls, and account creation. These live here rather than in Supabase Edge
# Functions for the same reason they were never Firebase Cloud Functions —
# Netlify runs them all on the free tier, next to the site that calls them.
#
# The shared logic in ../functions is a plain library with no hosting SDK in it,
# so it can be lifted somewhere else if this ever outgrows the free allowance.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # @supabase/supabase-js bundles cleanly, so nothing needs to stay external.

# The poll's schedule is declared in netlify/functions/poll-outlook.mjs via its
# exported config, so it stays next to the code that explains why it's 15 minutes.

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Referrer-Policy = "strict-origin-when-cross-origin"
